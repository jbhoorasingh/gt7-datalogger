name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }}, ${{ matrix.python }})
    # ubuntu/3.12 is what the Docker image runs, so it also lints and
    # type-checks; the 3.14 legs are the CPython the desktop binaries are
    # frozen with. ubuntu-24.04 rather than ubuntu-latest, which moves to
    # 26.04 in November 2026 (actions/runner-images#14748).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
            lint: true
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-26
            python: "3.14"
          - os: windows-2025
            python: "3.14"
            # Until the Windows leg has gone green on its own for a while
            # (#177, #187): a failure there is reported, not blocking.
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        if: matrix.lint
        run: ruff check app tests scripts
      - name: Type-check
        if: matrix.lint
        run: mypy app
      - name: Version is consistent
        if: matrix.lint
        # The five places a release bumps agree, and on a tag build the tag
        # matches them (#179).
        run: python ../scripts/version.py check
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Test
        run: npm test
      - name: Type-check & build
        run: npm run build

  docker:
    # Publishing lives in publish.yml. On PRs we only verify the image still
    # builds: amd64 only, and cache read-only so untrusted branches can't
    # thrash the buildx cache that main writes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # build-push-action uploads a build record as a workflow artifact on
      # every run, kept for the repository default of 90 days. On a PR check
      # the record is worthless once the job is green — the log is the
      # result — and they were most of the artifacts the repo held.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
